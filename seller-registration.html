<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seller Registration | DEBESMSCAT Campus Market</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- API Client -->
    <script src="js/api.js"></script>
    <nav class="topbar" aria-label="Main navigation">
      <div class="brand-wrap" onclick="window.location.href='index.html'">
        <div class="brand-logo">
          <img src="files/images/logo.png" alt="DEBESMSCAT Logo" />
        </div>
        <div class="brand-copy">
          <span class="brand-name">DEBESMSCAT</span>
          <span class="brand-sub">Campus Market</span>
        </div>
      </div>

      <div class="header-links">
        <a href="index.html" class="header-link">Home</a>
        <a href="seller-registration.html" class="header-link active">Seller Registration</a>
        <a href="seller-dashboard.html" class="header-link">Seller Dashboard</a>
        <a href="admin.html" class="header-link">Admin</a>
      </div>
    </nav>

    <main class="page-shell">
      <section class="page-panel hero-panel-dashboard">
        <div>
          <span class="eyebrow eyebrow-dark">Seller onboarding</span>
          <h1>Register your campus store</h1>
          <p>
            Create a seller profile and request approval to start listing products within the DEBESMSCAT marketplace.
          </p>
        </div>
      </section>

      <section class="management-grid">
        <form id="sellerRegistrationForm" class="panel form-panel">
          <div class="panel-head">
            <h2>Seller information</h2>
          </div>

          <div class="form-grid">
            <label>
              <span>Full name</span>
              <input type="text" name="fullName" placeholder="e.g. Maria Santos" required />
            </label>
            <label>
              <span>Email address</span>
              <input type="email" name="email" placeholder="seller@debesmscat.edu.ph" required />
            </label>
            <label>
              <span>Password</span>
              <input type="password" name="password" minlength="8" autocomplete="new-password" required />
            </label>
            <label>
              <span>Phone number</span>
              <input type="tel" name="phone" placeholder="09XX XXX XXXX" required />
            </label>
            <label>
              <span>Store name</span>
              <input type="text" name="storeName" placeholder="e.g. MRS Corner" required />
            </label>
            <label>
              <span>Category</span>
              <select name="category" required>
                <option value="">Select category</option>
                <option value="Food & Snacks">Food &amp; Snacks</option>
                <option value="Stationery">Stationery</option>
                <option value="Fashion">Fashion</option>
                <option value="Tech">Tech</option>
                <option value="Services">Services</option>
              </select>
            </label>
            <label>
              <span>Campus location</span>
              <input type="text" name="location" placeholder="Main gate / Student center" required />
            </label>
            <label class="full-width">
              <span>Business description</span>
              <textarea name="description" rows="4" placeholder="Tell us what you sell and how students can reach your store." required></textarea>
            </label>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-light btn-solid">Submit seller request</button>
          </div>
          <div id="formMessage" class="form-message" aria-live="polite"></div>
        </form>

        <aside class="panel overview-panel">
          <div class="panel-head">
            <h2>Pending seller requests</h2>
          </div>
          <div id="pendingSellers" class="stack-list"></div>
        </aside>
      </section>
    </main>

    <script src="js/script.js"></script>
    <script src="js/management.js"></script>
  </body>
</html>
